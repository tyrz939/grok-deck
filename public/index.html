<!doctype html>
<html lang="en" data-appearance="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="__THEME_COLOR__" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grok Deck" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Grok Deck</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <!--THEME-->
    <script src="/appearance.js"></script>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <aside id="side" hidden></aside>
    <div
      id="side-resize"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize sessions"
      aria-valuemin="220"
      aria-valuemax="480"
      aria-valuenow="280"
      tabindex="0"
      hidden
    ></div>
    <div id="keys" hidden></div>
    <div id="app">
      <header id="top"></header>
      <main id="main"><p class="hint">Loading</p></main>
      <p id="notice" hidden></p>
      <form id="composer" hidden>
        <div id="longbar" hidden></div>
        <div id="skeptic" hidden></div>
        <div id="queue" hidden></div>
        <div id="thumbs" hidden></div>
        <div id="chat-meta" class="chat-meta" hidden></div>
        <div class="composer-bar">
          <label class="sr" for="input">Message</label>
          <textarea
            id="input"
            rows="1"
            enterkeyhint="enter"
            autocomplete="off"
            autocapitalize="sentences"
            spellcheck="true"
            placeholder="Message"
          ></textarea>
          <div class="composer-tools">
            <button type="button" id="attach" aria-label="Menu" aria-haspopup="dialog">+</button>
            <div id="optbar" class="optbar" hidden></div>
            <div class="actions">
              <button type="submit" id="send">Send</button>
            </div>
          </div>
        </div>
        <input id="photos" type="file" accept="image/*" multiple hidden />
        <input id="files" type="file" multiple hidden />
      </form>
      <button type="button" id="jump" hidden>Latest</button>
      <div id="sheet" hidden><div class="sheet-panel" role="dialog" aria-label="Menu"></div></div>
      <div id="confirm" hidden><div class="confirm-panel" role="alertdialog" aria-modal="true"></div></div>
      <div id="viewer" hidden><img alt="Full size image" /></div>
      <div id="docview" hidden role="dialog" aria-modal="true" aria-label="File">
        <div class="docview-head">
          <span class="docview-name"></span>
          <div class="docview-tools"></div>
          <button type="button" class="icon-btn docview-close" aria-label="Close"></button>
        </div>
        <div class="docview-body"></div>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
